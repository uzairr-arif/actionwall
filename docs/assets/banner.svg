  <!-- wordmark -->
  <text x="268" y="152" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="82" font-weight="700" fill="#f8fafc">Action<tspan fill="#f87171">Wall</tspan></text>
  <text x="272" y="204" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="30" fill="#94a3b8">Security firewall for AI agents</text>
  <text x="272" y="248" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="21" fill="#64748b">deterministic · explainable · fail-closed</text>

  <!-- terminal card -->
  <g>
    <rect x="730" y="52" width="428" height="196" rx="14" fill="#0d1526" stroke="#1e293b" stroke-width="2"/>
    <circle cx="758" cy="80" r="7" fill="#ef4444"/><circle cx="780" cy="80" r="7" fill="#f59e0b"/><circle cx="802" cy="80" r="7" fill="#22c55e"/>
    <text x="758" y="126" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="18" fill="#e2e8f0">$ actionwall check "rm -rf /project/*"</text>
    <circle cx="766" cy="160" r="7" fill="#dc2626"/>
    <text x="782" y="167" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="18" font-weight="700" fill="#f87171">BLOCKED — CRITICAL</text>
    <text x="758" y="200" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="15" fill="#64748b">12 files &gt; max_bulk_delete: 10</text>
    <text x="758" y="224" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="15" fill="#64748b">policy: file_policy.max_bulk_delete</text>
