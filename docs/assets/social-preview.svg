<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-label="ActionWall — security firewall for AI agents">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b33"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <linearGradient id="sbrick" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="shot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <clipPath id="sshield">
      <path d="M256 52 L432 124 V286 C432 386 356 452 256 484 C156 452 80 386 80 286 V124 Z"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#sbg)"/>
  <rect x="24" y="24" width="1232" height="592" rx="28" fill="none" stroke="#1e293b" stroke-width="2"/>

