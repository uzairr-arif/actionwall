        <rect x="40"  y="424" width="56" height="36" rx="7"/><rect x="104" y="424" width="56" height="36" rx="7"/><rect x="168" y="424" width="56" height="36" rx="7"/><rect x="232" y="424" width="56" height="36" rx="7"/><rect x="296" y="424" width="56" height="36" rx="7"/><rect x="360" y="424" width="56" height="36" rx="7"/><rect x="424" y="424" width="56" height="36" rx="7"/>
      </g>
      <rect x="262" y="290" width="64" height="40" rx="8" fill="url(#shot)" transform="rotate(-6 294 310)"/>
