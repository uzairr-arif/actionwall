  <!-- brand block -->
  <text x="470" y="230" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="104" font-weight="700" fill="#f8fafc">Action<tspan fill="#f87171">Wall</tspan></text>
  <text x="476" y="292" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="38" fill="#94a3b8">Security firewall for AI agents</text>

  <!-- verdict chips -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">
    <rect x="476" y="330" width="128" height="48" rx="24" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="540" y="361" text-anchor="middle" fill="#4ade80">ALLOW</text>
    <rect x="620" y="330" width="180" height="48" rx="24" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="710" y="361" text-anchor="middle" fill="#fbbf24">ASK HUMAN</text>
    <rect x="816" y="330" width="132" height="48" rx="24" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="882" y="361" text-anchor="middle" fill="#f87171">BLOCK</text>
  </g>

  <!-- terminal card -->
  <g>
    <rect x="476" y="410" width="724" height="164" rx="16" fill="#0d1526" stroke="#1e293b" stroke-width="2"/>
    <circle cx="508" cy="442" r="8" fill="#ef4444"/><circle cx="532" cy="442" r="8" fill="#f59e0b"/><circle cx="556" cy="442" r="8" fill="#22c55e"/>
    <text x="508" y="492" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="24" fill="#e2e8f0">$ actionwall check "rm -rf /project/*"</text>
    <circle cx="517" cy="532" r="8" fill="#dc2626"/>
    <text x="536" y="540" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="24" font-weight="700" fill="#f87171">BLOCKED — CRITICAL</text>
    <text x="856" y="540" font-family="Cascadia Code, Consolas, ui-monospace, monospace" font-size="20" fill="#64748b">12 files &gt; max 10</text>
