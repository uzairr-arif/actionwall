    <rect width="512" height="512" rx="112" fill="url(#sbg)" stroke="#1e293b" stroke-width="6"/>
    <g clip-path="url(#sshield)">
      <g fill="url(#sbrick)">
        <rect x="40"  y="72" width="56" height="36" rx="7"/><rect x="104" y="72" width="56" height="36" rx="7"/><rect x="168" y="72" width="56" height="36" rx="7"/><rect x="232" y="72" width="56" height="36" rx="7"/><rect x="296" y="72" width="56" height="36" rx="7"/><rect x="360" y="72" width="56" height="36" rx="7"/><rect x="424" y="72" width="56" height="36" rx="7"/>
        <rect x="72"  y="116" width="56" height="36" rx="7"/><rect x="136" y="116" width="56" height="36" rx="7"/><rect x="200" y="116" width="56" height="36" rx="7"/><rect x="264" y="116" width="56" height="36" rx="7"/><rect x="328" y="116" width="56" height="36" rx="7"/><rect x="392" y="116" width="56" height="36" rx="7"/>
        <rect x="40"  y="160" width="56" height="36" rx="7"/><rect x="104" y="160" width="56" height="36" rx="7"/><rect x="168" y="160" width="56" height="36" rx="7"/><rect x="232" y="160" width="56" height="36" rx="7"/><rect x="296" y="160" width="56" height="36" rx="7"/><rect x="360" y="160" width="56" height="36" rx="7"/><rect x="424" y="160" width="56" height="36" rx="7"/>
        <rect x="72"  y="204" width="56" height="36" rx="7"/><rect x="136" y="204" width="56" height="36" rx="7"/><rect x="200" y="204" width="56" height="36" rx="7"/><rect x="264" y="204" width="56" height="36" rx="7"/><rect x="328" y="204" width="56" height="36" rx="7"/><rect x="392" y="204" width="56" height="36" rx="7"/>
        <rect x="40"  y="248" width="56" height="36" rx="7"/><rect x="104" y="248" width="56" height="36" rx="7"/><rect x="168" y="248" width="56" height="36" rx="7"/><rect x="232" y="248" width="56" height="36" rx="7"/><rect x="296" y="248" width="56" height="36" rx="7"/><rect x="360" y="248" width="56" height="36" rx="7"/><rect x="424" y="248" width="56" height="36" rx="7"/>
        <rect x="72"  y="292" width="56" height="36" rx="7"/><rect x="136" y="292" width="56" height="36" rx="7"/><rect x="200" y="292" width="56" height="36" rx="7"/><rect x="328" y="292" width="56" height="36" rx="7"/><rect x="392" y="292" width="56" height="36" rx="7"/>
        <rect x="40"  y="336" width="56" height="36" rx="7"/><rect x="104" y="336" width="56" height="36" rx="7"/><rect x="168" y="336" width="56" height="36" rx="7"/><rect x="232" y="336" width="56" height="36" rx="7"/><rect x="296" y="336" width="56" height="36" rx="7"/><rect x="360" y="336" width="56" height="36" rx="7"/><rect x="424" y="336" width="56" height="36" rx="7"/>
